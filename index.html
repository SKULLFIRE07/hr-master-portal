<!doctype html>

<head>

<body>
  <a class="skip-link" href="#main">Skip to services</a>
  <div class="page">
    <header class="masthead">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 27V8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v19M4 27h24M13 27v-6h6v6M12 11h1m6 0h1m-8 5h1m6 0h1"/></svg></div>
        <div><h1>HR Master Portal</h1><p>Everything you need for day-to-day HR — Payroll, IT, Medical, Sales, and HR support in one place.</p></div>
      </div>

      <noscript><div class="notice">JavaScript is needed to display the service directory. Please enable JavaScript and reload this page.</div></noscript>
